name: Check Arena
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: arena_test_only
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check worker.js
          node --check app.js
          node --check cloud.js
      - name: Test rankings and cloud persistence
        run: |
          node tests.cjs
          node cloud-tests.cjs
      - name: Test database setup, account isolation and transactional saves
        env:
          PGPASSWORD: arena_test_only
        run: |
          psql -h localhost -U postgres -d arena_test -v ON_ERROR_STOP=1 -f sql-test-bootstrap.sql
          psql -h localhost -U postgres -d arena_test -v ON_ERROR_STOP=1 -f supabase-setup.sql
          psql -h localhost -U postgres -d arena_test -v ON_ERROR_STOP=1 -f supabase-setup.sql
          psql -h localhost -U postgres -d arena_test -v ON_ERROR_STOP=1 -f sql-tests.sql
